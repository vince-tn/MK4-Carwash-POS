name: CI

# Lints, tests and builds every push and pull request. Vercel deploys main on
# its own; a red cross here is the signal that something pushed is broken.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 24 runs TypeScript directly, which the Edge Function's test needs.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
