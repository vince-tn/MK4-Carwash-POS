name: Supabase Keep-Alive

# Supabase pauses free-tier projects after 7 days of inactivity.
# This pings each project daily so it never reaches that threshold: the live
# one and the staging one, which can easily go a quiet week.
# GitHub's scheduler is best-effort and can be delayed by a while, so daily
# (rather than weekly) leaves plenty of margin.
#
# Requires:
#   - supabase/keep_alive.sql applied once to each project
#   - live: repo secrets SUPABASE_URL and SUPABASE_ANON_KEY
#   - staging: nothing; its address and public key are in .env.staging

on:
  schedule:
    # 06:23 UTC daily. Off-the-hour minutes get queued less than :00.
    - cron: "23 6 * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      # One project failing must not stop the other being pinged.
      fail-fast: false
      matrix:
        project: [live, staging]
    env:
      PROJECT: ${{ matrix.project }}
      LIVE_URL: ${{ secrets.SUPABASE_URL }}
      LIVE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - if: matrix.project == 'staging'
        uses: actions/checkout@v4

      - name: Pick the project
        run: |
          set -euo pipefail
          if [ "${PROJECT}" = "staging" ]; then
            url=$(sed -n 's/^VITE_SUPABASE_URL=//p' .env.staging | tr -d '\r')
            key=$(sed -n 's/^VITE_SUPABASE_ANON_KEY=//p' .env.staging | tr -d '\r')
          else
            url="${LIVE_URL:-}"
            key="${LIVE_KEY:-}"
          fi
          if [ -z "${url}" ] || [ -z "${key}" ]; then
            echo "::error::No address or key for ${PROJECT}. Live needs the repo secrets SUPABASE_URL and SUPABASE_ANON_KEY; staging reads .env.staging."
            exit 1
          fi
          echo "SUPABASE_URL=${url}" >> "${GITHUB_ENV}"
          echo "SUPABASE_ANON_KEY=${key}" >> "${GITHUB_ENV}"

      - name: Read from the database
        run: |
          set -euo pipefail

          # A real SELECT against public.keep_alive. A 200 here proves Postgres
          # itself answered, not just the edge — that is what counts as activity.
          code=$(curl -sS \
            --retry 3 --retry-delay 15 --retry-all-errors \
            --max-time 30 \
            -o response.json -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/keep_alive?select=id,created_at&limit=1")

          echo "Database responded: HTTP ${code}"
          if [ "${code}" != "200" ]; then
            echo "Response body:"
            cat response.json
            echo
            echo "::error::Expected HTTP 200 from the keep_alive read, got ${code}. If this is 404, apply supabase/keep_alive.sql to the project."
            exit 1
          fi
          cat response.json

      - name: Check Auth is up
        run: |
          set -euo pipefail

          # The app signs in through GoTrue, so verify that service too.
          code=$(curl -sS \
            --retry 3 --retry-delay 15 --retry-all-errors \
            --max-time 30 \
            -o /dev/null -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/auth/v1/health")

          echo "Auth responded: HTTP ${code}"
          if [ "${code}" != "200" ]; then
            echo "::error::Expected HTTP 200 from Auth, got ${code}."
            exit 1
          fi
