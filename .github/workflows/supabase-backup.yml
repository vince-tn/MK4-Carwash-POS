name: Supabase Backup

# The free plan has no backups, and a mistaken change cannot be undone. This
# dumps the database once a day, encrypts it, and keeps it as a workflow
# artifact for 30 days, so there is always a recent copy to restore from.
#
# The dump holds customer names, phone numbers and plate numbers, and the
# artifacts of a public repository can be downloaded by anyone signed in to
# GitHub. So the dump is encrypted with a passphrase before it is uploaded.
#
# Setup: add two repo secrets (Settings -> Secrets and variables -> Actions):
#   LIVE_DB_PASSWORD   The live database password (Supabase -> Database ->
#                      Settings). Staging Refresh uses it too.
#                      scripts/supabase-db-url.sh turns it into the "Session
#                      pooler" connection string (the "Direct connection" is
#                      IPv6 only on the free plan, which GitHub cannot reach).
#                      A full string in SUPABASE_DB_URL is used instead when
#                      present.
#   BACKUP_PASSPHRASE  A long random passphrase. Keep a copy somewhere safe:
#                      without it no backup can be opened.
# Until both exist, each run skips with a warning instead of failing.
#
# Not covered: payment proof images, which are files in Storage, not rows.
#
# To restore, download the artifact from a run's Summary page, then:
#   gpg --decrypt mk4-backup-<date>.tar.gz.gpg | tar xz
#   psql --single-transaction --variable ON_ERROR_STOP=1 \
#     --file roles.sql --file schema.sql \
#     --command 'SET session_replication_role = replica' \
#     --file data.sql --dbname "<connection string of the target project>"

on:
  schedule:
    # 17:41 UTC is 01:41 in Manila, after closing. Off the hour because
    # GitHub queues :00 jobs the longest.
    - cron: "41 17 * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      LIVE_DB_PASSWORD: ${{ secrets.LIVE_DB_PASSWORD }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets are configured
        id: secrets
        run: |
          if { [ -z "${SUPABASE_DB_URL:-}" ] && [ -z "${LIVE_DB_PASSWORD:-}" ]; } || [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "::warning::No backup taken. Add the LIVE_DB_PASSWORD and BACKUP_PASSPHRASE repo secrets to turn backups on."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.configured == 'true'

      # psql logs in to find the connection. Installed only if the runner
      # image lacks it.
      - name: Make sure psql is installed
        if: steps.secrets.outputs.configured == 'true'
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -yq postgresql-client)

      - name: Connect to the live project
        if: steps.secrets.outputs.configured == 'true'
        run: |
          set -euo pipefail
          live="${SUPABASE_DB_URL:-}"
          if [ -z "$live" ]; then
            live=$(DB_PASSWORD="$LIVE_DB_PASSWORD" bash scripts/supabase-db-url.sh vsxwwgglvckbjxvifxuw aws-1-ap-northeast-2.pooler.supabase.com)
          fi
          # The string holds the password: hidden from every log line after this.
          echo "::add-mask::$live"
          echo "LIVE_URL=$live" >> "$GITHUB_ENV"
          echo "Connected."

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.configured == 'true'
        with:
          version: latest

      - name: Dump roles, schema and data
        if: steps.secrets.outputs.configured == 'true'
        run: |
          set -euo pipefail
          mkdir backup
          supabase db dump --db-url "$LIVE_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$LIVE_URL" -f backup/schema.sql
          supabase db dump --db-url "$LIVE_URL" -f backup/data.sql --data-only --use-copy
          ls -l backup

      - name: Encrypt
        if: steps.secrets.outputs.configured == 'true'
        run: |
          set -euo pipefail
          name="mk4-backup-$(date -u +%Y-%m-%d)"
          tar czf "$name.tar.gz" -C backup .
          # Passphrase on stdin, so it never appears in a command line.
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes \
            --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 \
            --output "$name.tar.gz.gpg" "$name.tar.gz"
          rm -rf backup "$name.tar.gz"
          echo "ARCHIVE=$name.tar.gz.gpg" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.configured == 'true'
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          retention-days: 30
          if-no-files-found: error
